[package]
name = "tpt-app-cfd-studio"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = [".", "engine", "desktop"]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Pro edition (paid desktop build): 3D external-flow solve, the drag/lift
# coefficient report, and image/report export. The free WASM build compiles
# without it; `--features pro` is Pro.
pro = ["tpt-cfd-engine/pro"]

[dependencies]
tpt-appfront-core = { path = "D:/Programming/1PRODUCTION/Open Source/tpt-appfront/crates/tpt-appfront-core" }
tpt-appfront-dom = { path = "D:/Programming/1PRODUCTION/Open Source/tpt-appfront/crates/tpt-appfront-dom" }
tpt-cfd-engine = { path = "engine" }
# The viewer renders the solver's lattice fields directly.
tpt-phys-cfd = { path = "D:/Programming/1PRODUCTION/Open Source/tpt-physics/crates/tpt-phys-cfd" }
# Pinned to the installed wasm-bindgen CLI version — the CLI rejects wasm
# built against a different schema version. Bump both together.
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Location",
    "Element",
    "Node",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlHeadElement",
    "CssStyleDeclaration",
    "HtmlCollection",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "Event",
    "EventTarget",
    "Blob",
    "Url",
    "HtmlAnchorElement",
    "MouseEvent",
    "WheelEvent",
    "DomRect",
] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The desktop shell is a native binary; keep its codegen normal even in the
# same workspace (the `release` profile above applies to the wasm lib build).
[profile.release.package.tpt-cfd-desktop]
opt-level = 3

# The LBM hot loop is throughput-sensitive: opt-level "z" costs roughly 3x
# on it, and an under-performing solver directly stretches the in-browser
# animated solve. The engine crate opts into normal codegen even in the wasm
# build — its size contribution is small next to the UI glue.
[profile.release.package.tpt-cfd-engine]
opt-level = 3
